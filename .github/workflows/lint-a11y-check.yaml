name: A11y lint check PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-a11y:
    name: Run a11y lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run a11y ESLint
        id: lint
        run: |
          set +e
          npm run lint:a11y > lint-output.txt 2>&1
          status=$?
          set -e
          cat lint-output.txt
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- eslint-a11y-pr-comment -->';
            const failed = '${{ steps.lint.outputs.exit_code }}' !== '0';
            let output = fs.readFileSync('lint-output.txt', 'utf8').trim();
            const max = 60000;
            if (output.length > max) {
              output = output.slice(0, max) + '\n\n…truncated';
            }

            const body = failed
              ? `${marker}\n## A11y lint errors found\n\n\`\`\`text\n${output}\n\`\`\``
              : `${marker}\n## No a11y lint errors found`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if a11y lint failed
        if: steps.lint.outputs.exit_code != '0'
        run: exit 1
