default:
  paths:
    - features/features/guestbook/**/*.feature
  requireModule:
    - tsx/cjs
  require:
    - features/support/**/*.ts
    - features/step_definitions/**/*.ts
  format:
    - progress-bar
    - html:features/reports/results.html
  formatOptions:
    snippetInterface: async-await
  worldParameters:
    baseUrl: http://localhost:3000

# Named profiles replace `default` (they do not inherit)
admin:
  paths:
    - features/features/admin/**/*.feature
  requireModule:
    - tsx/cjs
  require:
    - features/support/**/*.ts
    - features/step_definitions/**/*.ts
  format:
    - progress-bar
    - html:features/reports/admin.html
  formatOptions:
    snippetInterface: async-await
  worldParameters:
    baseUrl: http://localhost:3000
